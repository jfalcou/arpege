name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Check formatting
        run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-latest
            preset_args: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: Windows (msvc)
            os: windows-latest
            preset_args: -DCMAKE_BUILD_TYPE=Release

    steps:
      - uses: actions/checkout@v4

      # Cached so raylib and imgui are not recloned on every push.
      - name: CPM source cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libasound2-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.preset_args }} -DARPG_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The tests only cover code that is free of any GUI call, so they run
      # headless on the runners.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Check the produced binary
        shell: bash
        run: |
          test -x build/bin/arpg || test -f build/bin/Release/arpg.exe || test -f build/bin/arpg.exe
          echo "binary produced"
